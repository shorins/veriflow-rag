[project]
name = "veriflow-rag"
version = "0.1.0"
description = "Agentic RAG Verification Framework using LlamaIndex and LangGraph"
authors = [{ name = "shorins", email = "mighty.shorin@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain (>=1.2.6,<2.0.0)",
    "langgraph (>=1.0.6,<2.0.0)",
    "llama-index (>=0.14.12,<0.15.0)",
    "llama-index-vector-stores-weaviate (>=1.4.1,<2.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "transformers (>=4.57.6,<5.0.0)",
    "sentence-transformers (>=5.2.0,<6.0.0)",
    "llama-index-embeddings-huggingface (>=0.6.1,<0.7.0)",
    "chainlit (>=2.9.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "weaviate-client (>=4.19.2,<5.0.0)",
    "pymupdf4llm (>=0.2.9,<0.3.0)",
    "llama-index-readers-file (>=0.5.6,<0.6.0)",
]

[tool.poetry]
packages = [{ include = "veriflow_rag", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
